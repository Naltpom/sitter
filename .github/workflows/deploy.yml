name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de deploiement'
        required: true
        type: choice
        options:
          - production
          - reset
        default: production

jobs:
  deploy:
    name: Deploy to VPS (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            MODE="${{ inputs.mode }}"
            cd "$APP_DIR"
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps.yml"

            echo "=== Deploy mode: $MODE ==="

            echo "=== Pull latest code ==="
            git fetch origin master
            git reset --hard origin/master

            if [ "$MODE" = "reset" ]; then
              echo "=== RESET: Stop all + remove volumes ==="
              $COMPOSE down -v --remove-orphans || true

              echo "=== RESET: Build from scratch ==="
              $COMPOSE build --no-cache

              echo "=== RESET: Start all services ==="
              $COMPOSE up -d
            else
              echo "=== PRODUCTION: Build updated images ==="
              $COMPOSE build

              echo "=== PRODUCTION: Rolling restart (zero-downtime) ==="
              $COMPOSE up -d --remove-orphans
            fi

            echo "=== Wait for API to be healthy ==="
            for i in $(seq 1 60); do
              if $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "API is healthy (attempt $i)"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "API failed to become healthy"
                $COMPOSE logs api --tail 50
                exit 1
              fi
              echo "Waiting for API health... (attempt $i)"
              sleep 5
            done

            if [ "$MODE" = "reset" ]; then
              echo "=== RESET: Seed data (admin + demo users) ==="
              $COMPOSE exec -T api python -m src.seed

              echo "=== RESET: Generate mass fixtures ==="
              $COMPOSE exec -T api python -m src.run_fixtures --scale 10000
            else
              echo "=== PRODUCTION: Migrations already applied by entrypoint ==="
              echo "=== PRODUCTION: No data wipe, no seed ==="
            fi

            echo "=== Cleanup old images ==="
            docker images --filter "reference=sitter*" --filter "dangling=true" -q | xargs -r docker rmi || true

            echo "=== Deployment complete ($MODE) ==="
            $COMPOSE ps
